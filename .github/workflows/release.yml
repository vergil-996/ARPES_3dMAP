name: Release BandScope

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Test and validate version
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate tag against app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (python -c "from bandscope.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' does not match APP_VERSION '$version'."
          }

      - name: Compile application sources
        shell: pwsh
        run: python -m compileall -q bandscope plugins scripts tests start.py plugin_api.py theme.py ui_controls.py

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v

  plugin:
    name: Build extension package
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 打包脚本只用到清单解析、兼容判定与签名，不必拉整套运行环境。
      - name: Install packaging dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy packaging cryptography

      - name: Validate tag against app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (python -c "from bandscope.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' does not match APP_VERSION '$version'."
          }

      # 同一仓库、同一个应用 Release，插件只打一次包，CPU 与 NVIDIA 安装版共用。
      # 脚本会重新打开产物核对清单与依赖，打包错误在这里就会失败。
      - name: Build flat band opacity extension
        shell: pwsh
        run: python scripts/release/build_plugin.py flat_band_opacity --output-dir release

      # 正式发布要求签名密钥与宿主内置公钥匹配；缺 Secret 或对不上就在这里失败，
      # 而不是先发一个客户端必然拒收的包。
      - name: Check the plugin signing key
        shell: pwsh
        env:
          BANDSCOPE_PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          BANDSCOPE_PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
        run: python scripts/release/sign_plugin.py --check-only

      - name: Sign extension packages
        shell: pwsh
        env:
          BANDSCOPE_PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          BANDSCOPE_PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
        run: |
          # PowerShell 不替原生程序展开通配符，这里显式枚举（与下面的目录步骤一致）。
          $packages = @(Get-ChildItem -Path release -Filter *.bsplugin | ForEach-Object { $_.FullName })
          if ($packages.Count -eq 0) { throw "release/ 里没有可签名的扩展包。" }
          python scripts/release/sign_plugin.py @packages

      # 目录保留仍受支持宿主的历史包：把上一版目录一并聚合进来。
      - name: Fetch the previous extension catalog
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          gh release download --repo "${{ github.repository }}" --pattern plugins-index.json --dir previous --clobber

      - name: Build the extension catalog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $args = @("scripts/release/build_plugin_catalog.py", "--tag", $tag,
                    "--output", "release/plugins-index.json")
          if (Test-Path -LiteralPath "previous/plugins-index.json") {
            $args += @("--merge", "previous/plugins-index.json")
          }
          $args += (Get-ChildItem -Path release -Filter *.bsplugin | ForEach-Object { $_.FullName })
          python @args

      - name: Sign the extension catalog
        shell: pwsh
        env:
          BANDSCOPE_PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          BANDSCOPE_PLUGIN_SIGNING_KEY_ID: ${{ secrets.PLUGIN_SIGNING_KEY_ID }}
        run: python scripts/release/sign_plugin.py release/plugins-index.json --purpose catalog

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandScope-extensions
          path: |
            release/*.bsplugin
            release/*.bsplugin.sha256
            release/*.bsplugin.sig
            release/plugins-index.json
            release/plugins-index.json.sig
          if-no-files-found: error
          compression-level: 0

  build:
    name: Build ${{ matrix.flavor }} installer
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: CPU
            requirements: requirements.txt
            spec: packaging/pyinstaller/ARPES_3dMAP.spec
          - flavor: NVIDIA
            requirements: requirements-gpu-cu13.txt
            spec: packaging/pyinstaller/ARPES_3dMAP_gpu.spec

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gpu-cu13.txt

      - name: Validate tag against app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (python -c "from bandscope.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' does not match APP_VERSION '$version'."
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r "${{ matrix.requirements }}"
          python -m pip install --disable-pip-version-check pyinstaller

      - name: Build PyInstaller bundle
        shell: pwsh
        run: pyinstaller --noconfirm --clean "${{ matrix.spec }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $version = (python -c "from bandscope.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          & $iscc "/DAppVersion=$version" "/DBuildFlavor=${{ matrix.flavor }}" "packaging\windows\BandScope.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = (python -c "from bandscope.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "release\BandScope-$version-Windows-x64-${{ matrix.flavor }}-Setup.exe"
          .\scripts\release\sign_windows.ps1 -Path $installer

      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $version = (python -c "from bandscope.app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "release\BandScope-$version-Windows-x64-${{ matrix.flavor }}-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not produced: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $leaf = Split-Path -Leaf $installer
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $leaf" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandScope-${{ matrix.flavor }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      # 扩展包与两种基础安装包挂在同一个 Release 上，扩展不单独建版本 tag。
      - name: Download installers and extension packages
        uses: actions/download-artifact@v5
        with:
          pattern: BandScope-*
          path: release
          merge-multiple: true

      - name: Publish immutable release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "BandScope ${GITHUB_REF_NAME}"
