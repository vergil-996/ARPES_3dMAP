name: Release BandScope

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Test and validate version
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate tag against app version
        shell: pwsh
        run: python scripts/check_release_version.py "${{ github.ref_name }}"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

  build:
    name: Build ${{ matrix.flavor }} installer
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: CPU
            requirements: requirements.txt
            spec: ARPES_3dMAP.spec
          - flavor: NVIDIA
            requirements: requirements-gpu-cu13.txt
            spec: ARPES_3dMAP_gpu.spec

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gpu-cu13.txt

      - name: Validate tag against app version
        shell: pwsh
        run: python scripts/check_release_version.py "${{ github.ref_name }}"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r "${{ matrix.requirements }}"
          python -m pip install --disable-pip-version-check pyinstaller

      - name: Build PyInstaller bundle
        shell: pwsh
        run: pyinstaller --noconfirm --clean "${{ matrix.spec }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $version = (python -c "from app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          & $iscc "/DAppVersion=$version" "/DBuildFlavor=${{ matrix.flavor }}" "installer\BandScope.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $version = (python -c "from app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "release\BandScope-$version-Windows-x64-${{ matrix.flavor }}-Setup.exe"
          .\scripts\sign_windows.ps1 -Path $installer

      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $version = (python -c "from app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          $installer = "release\BandScope-$version-Windows-x64-${{ matrix.flavor }}-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not produced: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $leaf = Split-Path -Leaf $installer
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $leaf" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandScope-${{ matrix.flavor }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v5
        with:
          pattern: BandScope-*
          path: release
          merge-multiple: true

      - name: Publish immutable release payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "BandScope ${GITHUB_REF_NAME}"
